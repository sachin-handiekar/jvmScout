name: Release

# Tagging a version (e.g. `git tag v0.1.0 && git push origin v0.1.0`) builds the
# native agent for all three OSes plus the BCI transformer jar and publishes
# them as assets on a GitHub Release — so users can run jvmScout without a C++
# toolchain.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Build the shared library on each target OS and stage a clearly-named asset.
  # ---------------------------------------------------------------------------
  agent:
    name: agent (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: libjvmti-agent-linux-x64.so
          - os: windows-latest
            asset: jvmti-agent-windows-x64.dll
          - os: macos-latest
            asset: libjvmti-agent-macos-arm64.dylib
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 24 (provides JAVA_HOME for JNI/JVMTI headers)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"

      - name: Install libcurl (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Configure
        run: cmake -S agent -B agent/build -D AGENT_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build agent/build --config Release

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          f=$(find agent/build -maxdepth 2 \
                \( -name 'jvmti-agent.dll' -o -name 'libjvmti-agent.so' -o -name 'libjvmti-agent.dylib' \) \
                | head -1)
          if [ -z "$f" ]; then echo "no agent library found"; exit 1; fi
          cp "$f" "dist/${{ matrix.asset }}"
          ls -l dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build the BCI transformer jar (JDK 24+).
  # ---------------------------------------------------------------------------
  bci:
    name: bci-transformer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"
      - name: Build bci-transform.jar
        run: |
          cd bci-classfile
          rm -rf out && mkdir out
          javac -d out src/main/java/*.java
          jar cf bci-transform.jar -C out .
      - uses: actions/upload-artifact@v4
        with:
          name: bci-transform.jar
          path: bci-classfile/bci-transform.jar
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build and publish the collector + dashboard image to GHCR, tagged with the
  # release version (and `latest`), so users can:
  #   docker run -p 8080:8080 ghcr.io/<owner>/jvmscout-collector:<version>
  # ---------------------------------------------------------------------------
  docker:
    name: publish docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/jvmscout-collector
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: collector/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Gather every artifact and attach them to the GitHub Release for the tag.
  # ---------------------------------------------------------------------------
  release:
    name: publish release
    needs: [agent, bci]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -lR dist

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
